<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes orbMove {
        0% { transform: translate(0, 0); }
        50% { transform: translate(40px, -20px); }
        100% { transform: translate(0, 0); }
      }

      .floating-bg-1 {
        animation: floatSlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-bg-2 {
        animation: floatReverse 9s ease-in-out infinite;
        transform-origin: center;
      }
      .pulsing-orb {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .dynamic-flow {
        stroke-dasharray: 8, 8;
        animation: dashMove 2.5s linear infinite;
      }
      .ambient-orb {
        animation: orbMove 12s ease-in-out infinite alternate;
      }
      .text-title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .text-subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .text-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Animated Lighting/Orbs (Strictly in Background) -->
  <g class="ambient-orb" opacity="0.6">
    <circle cx="180" cy="100" r="180" fill="#38bdf8" filter="url(#glow)" opacity="0.18" class="pulsing-orb" />
    <circle cx="1020" cy="300" r="220" fill="#818cf8" filter="url(#glow)" opacity="0.18" class="pulsing-orb" />
    <circle cx="600" cy="380" r="160" fill="#c084fc" filter="url(#glow)" opacity="0.12" class="pulsing-orb" />
  </g>

  <!-- Flow Lines / Data Streams (Background dynamics behind cards) -->
  <g opacity="0.45">
    <path d="M 50 360 C 250 360, 300 390, 500 390 C 700 390, 850 340, 1150 340" fill="none" stroke="#38bdf8" stroke-width="2" class="dynamic-flow" />
    <path d="M 50 60 C 350 60, 450 30, 750 30 C 950 30, 1050 70, 1150 70" fill="none" stroke="#818cf8" stroke-width="2" class="dynamic-flow" />
  </g>

  <!-- Left Dynamic Widget: Global Rates & Nexus Engine (Animated Background Element) -->
  <g class="floating-bg-1" transform="translate(60, 80)">
    <rect width="210" height="170" rx="16" fill="url(#badge-grad-1)" stroke="#334155" stroke-width="1.2" filter="url(#card-shadow)" />
    <circle cx="28" cy="28" r="7" fill="#ef4444" opacity="0.8" />
    <circle cx="48" cy="28" r="7" fill="#eab308" opacity="0.8" />
    <circle cx="68" cy="28" r="7" fill="#22c55e" opacity="0.8" />
    
    <text x="24" y="65" fill="#94a3b8" class="text-mono">ECONOMIC NEXUS</text>
    <rect x="24" y="76" width="162" height="18" rx="6" fill="#1e293b" />
    <rect x="24" y="76" width="130" height="18" rx="6" fill="#0284c7" opacity="0.4" />
    <text x="32" y="90" fill="#38bdf8" class="text-mono" font-size="11">US Threshold: 84%</text>

    <text x="24" y="122" fill="#94a3b8" class="text-mono">VAT REVERSE CHARGE</text>
    <rect x="24" y="132" width="90" height="20" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="32" y="146" fill="#34d399" class="text-mono" font-size="11">✓ VERIFIED</text>
  </g>

  <!-- Right Dynamic Widget: Compliance Stack & MCP (Animated Background Element) -->
  <g class="floating-bg-2" transform="translate(930, 170)">
    <rect width="210" height="170" rx="16" fill="url(#badge-grad-1)" stroke="#334155" stroke-width="1.2" filter="url(#card-shadow)" />
    <circle cx="28" cy="28" r="7" fill="#38bdf8" />
    <text x="44" y="32" fill="#cbd5e1" class="text-mono" font-size="12">TAX ENGINE PRIMITIVES</text>

    <g transform="translate(20, 52)">
      <rect width="170" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="12" y="18" fill="#e2e8f0" class="text-mono" font-size="11">⚡ Multi-Jurisdiction</text>
    </g>
    <g transform="translate(20, 86)">
      <rect width="170" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="12" y="18" fill="#e2e8f0" class="text-mono" font-size="11">🛡️ Immutable Audit Log</text>
    </g>
    <g transform="translate(20, 120)">
      <rect width="170" height="26" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="0.8" />
      <text x="12" y="18" fill="#a5b4fc" class="text-mono" font-size="11">🤖 AI-Native / MCP Ready</text>
    </g>
  </g>

  <!-- Foreground Main Content (Clear, crisp, perfectly centered & unobstructed) -->
  <g id="foreground-title" transform="translate(600, 155)">
    <!-- Main Pill Badge -->
    <g transform="translate(0, -60)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="-168" cy="0" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="5" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.1em" font-family="system-ui">
        GLOBAL TAX &amp; PAYMENT COMPLIANCE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="28" fill="url(#primary-glow)" font-size="52" text-anchor="middle" class="text-title" filter="url(#card-shadow)">
      Awesome Global Tax Compliance
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="74" fill="#f8fafc" font-size="19" text-anchor="middle" class="text-subtitle">
      Top Calculation Engines, Nexus Determination &amp; Self-Hosted Primitives
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 120)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui">💳 Sales Tax &amp; VAT</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text x="0" y="5" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui">📍 Nexus Tracking</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(80, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
        <text x="0" y="5" fill="#e879f9" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui">⚖️ Audit Trails</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(235, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
        <text x="0" y="5" fill="#6ee7b7" font-size="12" font-weight="600" text-anchor="middle" font-family="system-ui">🔓 Open Source</text>
      </g>
    </g>
  </g>

  <!-- Subtle Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-glow)" />
</svg>
